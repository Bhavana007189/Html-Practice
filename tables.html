
<html>
    <head>
        <title>Table</title>
        <style>
            table,th,td{
            border:1px solid black;
            border-collapse: collapse;
            }
        td{
            text-align: center;
        }
        table{
            width: 50%;
        }
        th,td{
            padding: 12px;
        }
        </style>
    </head>
    <body>
        <table>
            <caption><th colspan="4">data</th></caption>
            <tr>
                    <th>Name</th>
                    <th>Age</th>
                    <th colspan="3">Occupation</th>
            </tr>
            <tr>
                <td colspan="4">Subhash</td>
                <td>27</td>
                <td>Engineer</td>
                <td>Doctor</td>
            </tr>
            <tr>
                <td>Mounesh</td>
                <td>28</td>
                <td>Doctor</td>
                <td>Manager</td>
            </tr>
        </table>
    </body>
</html>
